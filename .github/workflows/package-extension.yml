name: Package extension

# Builds the fm-bridge binary for every supported platform, bundles them all
# into a single universal .vsix (the extension picks the right one at runtime),
# and attaches it to the GitHub Release on a `v*` tag. Also runnable on demand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # One binary per platform, uploaded as an artifact named bin-<platform>-<arch>.
  binaries:
    name: build ${{ matrix.dest }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `alt_target` is the ODBC sidecar's *other* architecture, shipped as
          # fm-bridge-odbc-x86 alongside the native one. The ODBC driver is
          # loaded into the process, so its architecture must match exactly —
          # and FileMaker Pro on Windows commonly registers only the 32-bit
          # driver, which a 64-bit process cannot load. Shipping both lets the
          # engine fall back automatically instead of asking a FileMaker
          # developer to reason about "bitness".
          - os: macos-latest
            target: aarch64-apple-darwin
            alt_target: x86_64-apple-darwin
            dest: darwin-arm64
            exe: fm-bridge
          - os: macos-latest
            target: x86_64-apple-darwin
            dest: darwin-x64
            exe: fm-bridge
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            alt_target: i686-pc-windows-msvc
            dest: win32-x64
            exe: fm-bridge.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            dest: linux-x64
            exe: fm-bridge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}${{ matrix.alt_target && format(', {0}', matrix.alt_target) || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # ── ODBC sidecar ──────────────────────────────────────────────────────
      # Optional by design: it is the only component that links a native driver
      # manager. If it cannot be built for a platform, that platform still ships
      # a working engine — schema tools are unaffected, and the live-data path
      # reports that it is unavailable instead of crashing.
      - name: ODBC build dependencies (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - name: Build ODBC sidecar
        id: sidecar
        continue-on-error: true
        shell: bash
        run: cargo build --release -p fm-bridge-odbc --target ${{ matrix.target }}
      - name: Build ODBC sidecar (alternate architecture)
        if: matrix.alt_target
        continue-on-error: true
        shell: bash
        run: cargo build --release -p fm-bridge-odbc --target ${{ matrix.alt_target }}

      - name: Stage binaries
        shell: bash
        run: |
          set -eu
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "staging/${{ matrix.exe }}"

          # Note: not `[ … ] && x=y` — under `set -e` a false test would abort.
          if [ "${{ runner.os }}" = "Windows" ]; then
            sidecar="fm-bridge-odbc.exe"
          else
            sidecar="fm-bridge-odbc"
          fi
          native="target/${{ matrix.target }}/release/$sidecar"
          if [ -f "$native" ]; then
            cp "$native" "staging/$sidecar"
          else
            echo "::warning::no ODBC sidecar for ${{ matrix.dest }} — live queries will be unavailable there"
          fi

          alt_target="${{ matrix.alt_target }}"
          if [ -n "$alt_target" ]; then
            alt="target/$alt_target/release/$sidecar"
            if [ -f "$alt" ]; then
              # The engine looks for this name first (see data.rs).
              case "$sidecar" in
                *.exe) cp "$alt" "staging/fm-bridge-odbc-x86.exe" ;;
                *)     cp "$alt" "staging/fm-bridge-odbc-x86" ;;
              esac
            else
              echo "::warning::no alternate-architecture sidecar for ${{ matrix.dest }}"
            fi
          fi
          ls -l staging
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.dest }}
          path: staging/*

  # Assemble every binary into editors/vscode/bin/ and package one .vsix.
  package:
    name: package vsix
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the .vsix to the GitHub Release on a tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
      - name: Assemble bin/
        shell: bash
        run: |
          cd editors/vscode
          mkdir -p bin
          for d in ../../artifacts/bin-*; do
            dest="$(basename "$d")"          # bin-darwin-arm64
            dest="${dest#bin-}"              # darwin-arm64
            mkdir -p "bin/$dest"
            cp "$d"/* "bin/$dest/"
            chmod +x "bin/$dest/"* || true   # artifacts drop the +x bit
          done
          ls -R bin
      - name: Build & package
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: fm-bridge-vsix
          path: editors/vscode/*.vsix
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: editors/vscode/*.vsix
